<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karaoke Punch</title>
<!-- Страница для телефона. Отдаётся приложением по местной сети и живёт
     ровно столько, сколько открыто окно студии (см. main.js, «Пение
     с телефона»). Всё своё носит с собой: ни одного внешнего адреса. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100dvh; background: #0b0f14; color: #e8f0ea;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overscroll-behavior: none;
  }
  header { padding: max(12px, env(safe-area-inset-top)) 16px 8px; display: flex;
    align-items: center; gap: 10px; }
  .name { font-size: 14px; color: #93a5a0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center;
    gap: 18px; padding: 12px 18px; text-align: center; }
  .line { font-weight: 700; line-height: 1.25; }
  .now { font-size: clamp(26px, 8vw, 46px); }
  .next { font-size: clamp(18px, 5.5vw, 30px); color: #5c6b66; }
  .w { color: #e8f0ea; }
  .w.sung { color: #34d399; }
  footer { padding: 10px 16px max(16px, env(safe-area-inset-bottom)); display: flex;
    align-items: center; gap: 12px; }
  button {
    appearance: none; border: 1px solid #2b3a34; background: #12201a; color: #e8f0ea;
    border-radius: 999px; padding: 14px 22px; font-size: 17px; font-weight: 600;
  }
  button:active { background: #1b2f26; }
  input[type=range] { flex: 1; accent-color: #34d399; }
  .time { font-variant-numeric: tabular-nums; font-size: 13px; color: #93a5a0; min-width: 74px;
    text-align: right; }
  .нет { color: #93a5a0; font-size: 15px; }
</style>
</head>
<body>
<header><span class="name" id="имя"></span></header>
<main>
  <div class="line now" id="строка"><span class="нет">Нажми «Играть»</span></div>
  <div class="line next" id="дальше"></div>
</main>
<footer>
  <button id="играть">▶︎ Играть</button>
  <input type="range" id="полоса" min="0" max="1000" value="0">
  <span class="time" id="часы">0:00</span>
</footer>
<audio id="звук" preload="auto" playsinline></audio>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const звук = $('звук');
  let данные = { строки: [], имя: '' };
  try {
    данные = await (await fetch('данные.json')).json();
  } catch (e) { $('строка').textContent = 'Не получилось получить разметку'; }
  $('имя').textContent = данные.имя || '';
  звук.src = 'звук';

  const строки = данные.строки || [];
  let текущая = -1;

  // Слово красится целиком: телефон держат в руке, и плавная заливка
  // на нём читается хуже, чем честная смена цвета
  function нарисовать(i, поз) {
    if (i !== текущая) {
      текущая = i;
      const el = $('строка');
      el.textContent = '';
      if (i < 0) { el.innerHTML = '<span class="нет">…</span>'; }
      else {
        (строки[i].слова || [{ текст: строки[i].текст, от: строки[i].от, до: строки[i].до }])
          .forEach((с) => {
            const s = document.createElement('span');
            s.className = 'w';
            s.textContent = с.текст;
            s.dataset.от = с.от;
            s.dataset.до = с.до;
            el.append(s);
          });
      }
    }
    /* Подпись «дальше» — по ВРЕМЕНИ, а не по номеру: до первой строки
       так видно, что пойдёт первым, а после последней не всплывает
       снова начало песни (соседний номер этого не умеет). */
    const след = i >= 0 ? строки[i + 1] : строки.find((л) => л.от > поз);
    const хочу = след ? след.текст : '';
    if ($('дальше').textContent !== хочу) $('дальше').textContent = хочу;
    if (i < 0) return;
    $('строка').querySelectorAll('.w').forEach((s) => {
      s.classList.toggle('sung', поз >= Number(s.dataset.до));
    });
  }

  function времяСтроки(поз) {
    for (let i = строки.length - 1; i >= 0; i--) {
      if (поз >= строки[i].от - 0.3 && поз <= строки[i].до + 0.6) return i;
    }
    return -1;
  }

  const мс = (t) => {
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + String(s).padStart(2, '0');
  };

  function кадр() {
    const поз = звук.currentTime;
    нарисовать(времяСтроки(поз), поз);
    $('часы').textContent = мс(поз);
    if (звук.duration) $('полоса').value = String(Math.round((поз / звук.duration) * 1000));
  }
  function крутить() { кадр(); requestAnimationFrame(крутить); }
  requestAnimationFrame(крутить);
  /* Плюс к кадрам — сам звук. requestAnimationFrame останавливается,
     стоит вкладке уйти в тень (на телефоне это каждый раз, когда
     гаснет экран или человек переключился), а timeupdate идёт своим
     ходом: вернулся к экрану — строка уже правильная, а не та,
     на которой всё замерло. */
  звук.addEventListener('timeupdate', кадр);
  звук.addEventListener('seeked', кадр);

  $('играть').addEventListener('click', async () => {
    if (звук.paused) { await звук.play(); $('играть').textContent = '❚❚ Пауза'; }
    else { звук.pause(); $('играть').textContent = '▶︎ Играть'; }
  });
  $('полоса').addEventListener('input', () => {
    if (звук.duration) звук.currentTime = ($('полоса').value / 1000) * звук.duration;
  });
  // Экран не гаснет посреди песни, если браузер это умеет
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) { /* не всюду есть */ }
})();
</script>
</body>
</html>
