# Быстрые проверки на каждый push и pull request.
#
# Что здесь НЕ делается: сборка приложения и полная самопроверка
# в Electron. Она поднимает окно, рисует холст и гоняет звук — на это
# нужен настоящий рабочий стол, и идёт она минуты. Её место — на своей
# машине перед выпуском (README, «Как выпускать»). Сюда попадает только
# то, что считается из файлов за секунды, но ломалось по-настоящему:
# арифметика разметки, подгонка текста, версии, ключи перевода.
name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Имя работы (её ключ) GitHub разбирает как опознаватель и берёт
  # только латиницу, цифры, «_» и «-»: с «быстрые-проверки» весь файл
  # считался негодным и запуск падал ещё до первого шага. По-русски
  # работа подписана в name — именно его и видно в отчёте. Проверку
  # на это держит тест «ключи работ в GitHub Actions — латиницей».
  checks:
    name: Быстрые проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Зависимостей у сайта нет вовсе — ставить нечего, проверки
      # идут на голом Node. Это и есть причина, по которой они быстрые.
      - name: Арифметика, версии и переводы
        run: node --test

      - name: Синхронность приложения с сайтом
        run: node .github/sync-check.js
