<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>карточка</title>
<style>
@font-face { font-family: 'Bungee'; src: url('fonts/bungee.woff2') format('woff2'); font-display: block; }
@font-face { font-family: 'Bungee Shade'; src: url('fonts/bungee-shade.woff2') format('woff2'); font-display: block; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  background: radial-gradient(ellipse at 22% 12%, rgba(53, 156, 110, 0.32), transparent 62%), #0a0a0f;
  color: #f2f2f7;
  font-family: -apple-system, "Helvetica Neue", sans-serif;
  display: flex;
  align-items: center;
  gap: 56px;
  padding: 0 70px;
}
.logo {
  width: 372px;
  height: 372px;
  flex: none;
  /* Скругление у знака своё, нарисованное. Мы его НЕ режем своим
     border-radius: углы в logo.png белые (прозрачности в файле нет),
     и любое несовпадение радиусов вылезало белыми полосками по низу.
     Берём logo-card.png — тот же знак, но с вырезанными углами, —
     и тень кладём по силуэту (drop-shadow), а не по прямоугольнику. */
  filter: drop-shadow(0 24px 46px rgba(0, 0, 0, 0.62));
}
.mark {
  font-family: 'Bungee Shade', Impact, sans-serif;
  font-size: 68px;
  line-height: 1.04;
  color: #54C492;
}
.tag {
  margin-top: 26px;
  font-size: 35px;
  line-height: 1.22;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.sub { margin-top: 18px; font-size: 21px; line-height: 1.45; color: #9a9ab0; }
.host {
  margin-top: 30px;
  font-family: 'Bungee', Impact, sans-serif;
  font-size: 21px;
  color: #54C492;
  letter-spacing: 0.03em;
}
</style>
</head>
<body>
  <img class="logo" src="shots/logo-card.png" alt="">
  <div>
    <div class="mark">KARAOKE<br>PUNCH</div>
    <div class="tag">Караоке из любой песни</div>
    <div class="sub">Нейросеть убирает вокал и сама расставляет<br>времена по твоему тексту. Mac и Windows</div>
    <div class="host">karaokepunch.ru</div>
  </div>
</body>
</html>
